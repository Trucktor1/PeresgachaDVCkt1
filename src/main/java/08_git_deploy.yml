---
- name: Scenario 8 - Deploy application from Git
  hosts: webservers
  become: yes

  vars:
    repo_url: "https://github.com/example/simple-app.git" # Замените на реальный URL
    app_dir: "/var/www/myapp"

  tasks:
    - name: Install Git
      apt:
        name: git
        state: present

    - name: Clone the repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: master
        update: yes

    - name: Set permissions for the app directory
      file:
        path: "{{ app_dir }}"
        owner: www-data
        group: www-data
        recurse: yes